<title>Summer Overpass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: a letterboxed 16:9 screening frame filling the viewport, one quiet control strip beneath it. Single dark look on purpose (it is a film player). */
  :root {
    --bg: #07090c;          /* theatre black, slight blue bias */
    --panel: #10141a;
    --fg: #e8ecf1;
    --muted: #8a96a5;
    --accent: #3aa6d8;      /* sky teal from the film */
    --line: #232a33;
    --font-ui: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    display: flex; flex-direction: column; gap: 12px; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; box-sizing: border-box;
  }
  #wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; background: #000; max-width: 100%; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #credit { position: absolute; left: 50%; top: 0; height: 100%; width: 0; pointer-events: none; font-family: var(--font-ui); color: #fff; }
  #credit .role, #credit .name { position: absolute; left: 0; transform: translate(-50%, -50%); white-space: nowrap; text-shadow: 0 0 0.6em rgba(0,0,0,0.25); }
  #credit .role { font-size: 1.36em; font-weight: 500; letter-spacing: 0.42em; padding-left: 0.42em; }
  #credit .name { font-size: 2.2em; font-weight: 600; letter-spacing: 0.40em; padding-left: 0.40em; }
  #ui { display: none; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1280px; width: 100%; margin: 0 auto; }
  #play {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font-size: 12px; cursor: pointer;
  }
  #play:hover { border-color: var(--accent); }
  #play:focus-visible, #bar:focus-visible, #name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .track { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #bar { height: 6px; background: var(--line); border-radius: 3px; cursor: pointer; position: relative; }
  #fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }
  #shotname { letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; flex: none; }
  .namefield { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  #name {
    width: 170px; max-width: 46vw; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font: 600 12px var(--font-ui); letter-spacing: 0.18em; text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) { #play { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<div id="wrap">
  <div id="stage">
    <canvas id="c" aria-label="Animated short, eight shots of a Japanese summer town"></canvas>
    <div id="credit" aria-live="off"><div class="role"></div><div class="name"></div></div>
    <div id="ui"></div>
  </div>
</div>
<div class="controls">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <div class="track">
    <div id="bar" role="slider" aria-label="Seek" tabindex="0"><div id="fill"></div></div>
    <div class="meta"><span id="shotname">Loading shots…</span><span id="time">0:00 / 0:28</span></div>
  </div>
  <label class="namefield" for="name">Credit name <input id="name" type="text" value="YOUR NAME" maxlength="28" autocomplete="off"></label>
</div>

<script>
  (function () {
    var input = document.getElementById('name');
    var apply = function () { var el = document.querySelector('#credit .name'); if (el) el.textContent = (input.value || ' ').toUpperCase(); };
    input.addEventListener('input', apply);
    try { var saved = localStorage.getItem('credit-name'); if (saved) input.value = saved; } catch (e) {}
    input.addEventListener('change', function () { try { localStorage.setItem('credit-name', input.value); } catch (e) {} });
    // main.js writes the default name once on load; re-apply the field afterwards
    window.addEventListener('load', function () { setTimeout(apply, 50); setTimeout(apply, 1500); });
  })();
</script>
<script type="module" src="main.js"></script>
