<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陽炎 KAGERŌ — Opening</title>
<style>
  @font-face { font-family: 'MontserratLocal'; src: url('../fonts/montserrat-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'MontserratLocal', Arial, sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; display: flex; gap: 12px; align-items: center; opacity: 0; transition: opacity .25s;
        background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff; font-size: 12px; letter-spacing: .04em; }
  #stage:hover #ui { opacity: 1; }
  #ui button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; font: inherit; cursor: pointer; padding: 3px 8px; border-radius: 3px; }
  #play { width: 34px; }
  #bar { flex: 1; height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; cursor: pointer; }
  #fill { height: 100%; width: 0; background: #d4202c; border-radius: 2px; }
  #segname { min-width: 180px; opacity: .8; }
  .render #ui { display: none; }
  /* preload CJK + Latin so canvas text is ready on the first frame */
  #fontwarm { position: absolute; left: -9999px; top: 0; font-weight: 900; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="play" aria-label="Play or pause">❚❚</button>
      <div id="bar"><div id="fill"></div></div>
      <span id="time"></span><span id="segname"></span>
      <button id="sound" hidden>Sound off</button>
    </div>
  </div>
</div>
<span id="fontwarm" style="font-family:MontserratLocal">KAGERO 0123</span>
<audio id="music" src="audio/theme.wav" preload="auto"></audio>
<script>if (location.search.includes('render')) document.documentElement.classList.add('render');</script>
<script type="module" src="main.js"></script>
</body>
</html>
